<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#3a2b4d" />
  <title>Mochi — a little cat, a little question</title>
  <meta name="description" content="Meet Mochi. Give the cat some love and see what happens." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="scene" aria-label="3D cat named Mochi"></canvas>

  <!-- Ambient loading veil -->
  <div id="loader" class="loader">
    <div class="loader__paw" aria-hidden="true">
      <span></span><span></span><span></span><span></span>
    </div>
    <p class="loader__text">warming up a cozy afternoon…</p>
  </div>

  <!-- Heads-up interface -->
  <div id="hud" class="hud" hidden>
    <header class="topbar">
      <div class="meter" role="progressbar" aria-label="Mochi's affection" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="meter__heart" aria-hidden="true">
          <svg viewBox="0 0 32 29" width="26" height="24">
            <path d="M16 28C5 20 0 14 0 8.5 0 3.8 3.6 0 8.2 0 11 0 13.7 1.4 16 4 18.3 1.4 21 0 23.8 0 28.4 0 32 3.8 32 8.5 32 14 27 20 16 28Z"/>
          </svg>
        </div>
        <div class="meter__track"><div class="meter__fill" id="meterFill"></div></div>
        <span class="meter__label" id="meterLabel">new friends</span>
      </div>
      <button id="soundBtn" class="icon-btn" aria-pressed="false" aria-label="Turn sound on" title="Sound">
        <svg class="icon-off" viewBox="0 0 24 24" width="20" height="20"><path d="M4 9v6h4l5 5V4L8 9H4z"/><line x1="16" y1="9" x2="22" y2="15"/><line x1="22" y1="9" x2="16" y2="15"/></svg>
        <svg class="icon-on" viewBox="0 0 24 24" width="20" height="20"><path d="M4 9v6h4l5 5V4L8 9H4z"/><path d="M16 8.5a5 5 0 0 1 0 7"/><path d="M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>
      </button>
    </header>

    <p id="whisper" class="whisper">Meet <b>Mochi</b>. Drag to look around — then give this cat some love.</p>

    <nav class="dock" aria-label="Ways to bond with Mochi">
      <button class="act" id="petBtn"><span class="act__emoji">🫧</span><span>Pet</span></button>
      <button class="act" id="feedBtn"><span class="act__emoji">🐟</span><span>Feed</span></button>
      <button class="act" id="playBtn"><span class="act__emoji">🧶</span><span>Play</span></button>
    </nav>
  </div>

  <!-- The moment -->
  <div id="proposal" class="proposal" hidden>
    <div class="card" role="dialog" aria-modal="true" aria-labelledby="askTitle">
      <p class="card__eyebrow">Mochi has something to ask</p>
      <h1 id="askTitle" class="card__title">Will you be my girlfriend?</h1>
      <p class="card__sub">No pressure. Mochi will wait as long as it takes. 🐾</p>
      <div class="card__actions">
        <button id="yesBtn" class="yes">Yes 💛</button>
        <button id="noBtn" class="no">No</button>
      </div>
    </div>
  </div>

  <!-- The answer -->
  <div id="finale" class="finale" hidden>
    <div class="finale__card">
      <h2 class="finale__title">Yay!! 💛</h2>
      <p class="finale__text">Mochi is doing happy little zoomies. Best day ever.</p>
      <button id="replayBtn" class="ghost">start over</button>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
